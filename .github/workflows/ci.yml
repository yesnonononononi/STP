name: CI Pipeline

on:
  push:
    branches: [ "main", "develop" ]
  pull_request:
    branches: [ "main", "develop" ]

jobs:
  backend-ci:
    name: Backend CI (Java 21 / Maven)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Run Tests & Build with Maven
        # 鎵ц瀹屾暣缂栬瘧銆佹祴璇曚笌鎵撳寘锛汮aCoCo 瑕嗙洊鐜囬棬绂佸湪 verify 闃舵鐢熸晥锛?        # 鑻ュ崟鍏冩祴璇曞け璐ユ垨鍏抽敭妯″潡瑕嗙洊鐜囦綆浜庨槇鍊硷紝娴佹按绾夸細鑷姩鎷︽埅骞跺憡璀︺€?        run: mvn -B clean verify --file pom.xml

      - name: Upload JaCoCo coverage reports
        # 鏃犺鏋勫缓鎴愬姛涓庡惁閮戒笂浼犳姤鍛婏紝渚夸簬瀹氫綅瑕嗙洊鐜囬棬绂佸け璐ュ師鍥?        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-coverage-reports
          path: |
            stp-payment-service/target/site/jacoco/
            stp-order-service/target/site/jacoco/
            stp-coupon-service/target/site/jacoco/
          if-no-files-found: warn
          retention-days: 7

  frontend-ci:
    name: Frontend CI (${{ matrix.app }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        app: [frontend-client, frontend-admin]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: ${{ matrix.app }}/package-lock.json

      - name: Install dependencies & Build (${{ matrix.app }})
        working-directory: ${{ matrix.app }}
        run: |
          npm ci
          npm run build
