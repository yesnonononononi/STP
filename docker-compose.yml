services:
  redis:
    container_name: stp-redis
    image: redis:8
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    restart: always
    env_file:
      - .env
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3

  mysql:
    container_name: stp-mysql
    image: mysql:8.0.30
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
      - ./mysql-schema.sql:/docker-entrypoint-initdb.d/1-schema.sql
      - ./init.sql:/docker-entrypoint-initdb.d/2-data.sql
      - ./seata.sql:/docker-entrypoint-initdb.d/3-seata.sql
    restart: always
    env_file:
      - .env
    environment:
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 3

  minio:
    container_name: stp-minio
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data
    restart: always
    env_file:
      - .env
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/ready"]
      interval: 10s
      timeout: 5s
      retries: 5

  nacos:
    container_name: stp-nacos
    image: nacos/nacos-server:v3.2.3
    depends_on:
       mysql:
         condition: service_healthy
    ports:
      - "8848:8848"
      - "9848:9848"
      - "8080:8080"
    volumes:
      - nacos-data:/home/nacos/data
      - nacos-logs:/home/nacos/logs
    restart: always
    env_file:
      - .env
    environment:
      NACOS_AUTH_TOKEN: ${NACOS_AUTH_TOKEN}
      MODE: standalone
      SPRING_DATASOURCE_PLATFORM: mysql
      MYSQL_SERVICE_HOST: mysql
      MYSQL_SERVICE_PORT: 3306
      MYSQL_SERVICE_DB_NAME: nacos
      MYSQL_SERVICE_DB_PARAM: 'characterEncoding=utf8&connectTimeout=10000&allowPublicKeyRetrieval=true&useSSL=false'
      NACOS_AUTH_IDENTITY_KEY: STP-Auth-Key
      NACOS_AUTH_IDENTITY_VALUE: STP-Auth-Value
      MYSQL_SERVICE_USER: root
      MYSQL_SERVICE_PASSWORD: ${MYSQL_ROOT_PASSWORD}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8848/nacos/"]
      interval: 10s
      timeout: 5s
      retries: 10

  rabbitmq:
    container_name: stp-rabbitmq
    image: rabbitmq:4.3.4
    ports:
      - "15672:15672"
      - "5672:5672"
      - "15671:15671"
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    restart: always
    env_file:
      - .env
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_DEFAULT_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_DEFAULT_PASS}
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  seata:
    container_name: stp-seata
    image: seataio/seata-server:2.0.0-slim
    restart: always
    ports:
      - "8091:8091"
      - "7091:7091"
    environment:
      SEATA_PORT: 8091
      SEATA_MODE: db
    depends_on:
      mysql:
          condition: service_healthy
    volumes:
      - ./seata.yml:/seata-server/resources/application.yml

  auth-service:
    container_name: stp-auth-service
    build: ./stp-auth-service

    ports:
      - "8081:8081"
    env_file:
      - .env
    environment:
      # 固定服务名映射
      MYSQL_HOST: mysql
      REDIS_HOST: redis
      NACOS_HOST: nacos
      MINIO_HOST: minio
      RABBITMQ_HOST: rabbitmq
      # JWT 密钥仅注入认证服务，避免其他模块扫描 common 时误创建 JWT Bean
      STP_AUTH_JWT_SECRET_KEY: ${STP_AUTH_JWT_SECRET_KEY:-stp-docker-jwt-secret-change-me-20260803-please-override}
    restart: always
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      nacos:
        condition: service_healthy
  admin-service:
    container_name: stp-admin-service
    build: ./stp-admin-service
