      NACOS_HOST: nacos
      MINIO_HOST: minio
      RABBITMQ_HOST: rabbitmq
    restart: always
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      nacos:
        condition: service_healthy

  gateway-service:
    container_name: stp-gateway-service
    build: ./stp-gateway
    ports:
      - "9090:9090"
    env_file:
      - .env
    environment:
      MYSQL_HOST: mysql
      REDIS_HOST: redis
      NACOS_HOST: nacos
      RABBITMQ_HOST: rabbitmq
      MINIO_HOST: minio
    restart: always
    depends_on:
      nacos:
        condition: service_healthy
      redis:
        condition: service_healthy

  user-service:
