server:
  port: 8082

spring:
  application:
    name: stp-user-service
  config:
    import:
      - optional:nacos:jdbc.yaml
      - optional:nacos:redis.yaml
      - optional:file:.env[.properties]
      - optional:nacos:queue.yaml
      - optional:nacos:sentinel.yaml
      - optional:nacos:minio.yaml
      - optional:nacos:shared-common.yaml
      - optional:nacos:shared-seata.yaml?group=SEATA_GROUP
  cloud:
    nacos:
      config:
        import-check:
          enabled: false
        username: ${NACOS_USER_NAME}
        password: ${NACOS_USER_PASSWORD}
        refresh-enabled: true
        file-extension: yaml
      server-addr: ${HOST}:8848


stp:
  auth:
    jwt:
      secret-key: ${STP_AUTH_JWT_SECRET_KEY}
  jdbc:
    mapper-locations: classpath*:mapper/user/**/*.xml,classpath*:mapper/member/**/*.xml,classpath*:mapper/relationship/**/*.xml
    type-aliases-package: com.summit.stp.user.infrastructure.persistence.po,com.summit.stp.member.infrastructure.persistence.po

logging:
  level:
    com.alibaba.nacos.client.config: WARN