server:
  port: 8083

spring:
  application:
    name: stp-post-service
  elasticsearch:
    uris: http://${HOST}:9200
  config:
    import:
      - optional:nacos:jdbc.yaml
      - optional:nacos:redis.yaml
      - optional:nacos:queue.yaml
      - optional:file:.env[.properties]
      - optional:nacos:minio.yaml
      - optional:nacos:sentinel.yaml
      - optional:nacos:shared-seata.yaml?group=SEATA_GROUP
      - optional:nacos:shared-common.yaml
  cloud:
    nacos:
      config:
        import-check:
          enabled: false
        username: ${NACOS_USER_NAME}
        password: ${NACOS_USER_PASSWORD}
        refresh-enabled: true
        file-extension: yaml
      server-addr: ${HOST}:8848

  # 文件上传限制：multipart 请求限制需要高于业务层的图片/视频限制
  servlet:
    multipart:
      max-file-size: ${MAX_FILE_SIZE}
      max-request-size: ${MAX_REQUEST_SIZE}
stp:
  jdbc:
    mapper-locations: classpath*:mapper/post/**/*.xml,classpath*:mapper/rank_board/**/*.xml
    type-aliases-package: com.summit.stp.post.infrastructure.persistence.po,com.summit.stp.rank_board.infrastructure.persistence.po

